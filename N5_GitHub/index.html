<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#d92779">
  <title>JLPT N5</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#251821;background:radial-gradient(circle at 50% 0,#ffe5f1,transparent 42%),#fffafc}.wrap{width:min(92%,680px);margin:auto;padding:42px 0}header{text-align:center;margin-bottom:34px}.mark{width:74px;height:74px;margin:auto;display:grid;place-items:center;border-radius:22px;background:#d92779;color:#fff;font-size:2rem;font-weight:900;box-shadow:0 12px 25px #d9277940}h1{font-size:clamp(1.8rem,7vw,2.6rem);margin:18px 0 8px}.sub{color:#786b74;line-height:1.6}.box{padding:24px;background:#fff;border:1px solid #ead7e1;border-radius:20px;box-shadow:0 12px 35px rgba(104,22,65,.09)}label{display:block;font-weight:800;margin-bottom:10px}select{width:100%;padding:16px;border:1px solid #ead7e1;border-radius:12px;background:#fff;font-size:16px;color:#251821}footer{text-align:center;color:#9b8d95;font-size:.8rem;margin-top:30px}
  </style>
</head>
<body>
  <main class="wrap">
    <header><div class="mark">🌸</div><h1>Ôn tập JLPT N5</h1><div class="sub">Chọn nội dung đã học để bắt đầu ôn tập</div></header>
    <section class="box">
      <select id="lessonSelect" onchange="const target=this.value;this.value='';if(target) window.location.href=target">
        <option value="">-- Chọn nội dung ôn tập --</option>
        <optgroup label="Bảng chữ cái">
          <option value="mini_test_kana/hiragana/index.html">Hiragana</option>
          <option value="mini_test_kana/katakana/index.html">Katakana</option>
        </optgroup>
        <optgroup label="Từ vựng">
          <option value="bai1/index.html">Bài 1</option>
          <option value="bai2/index.html">Bài 2</option>
          <option value="bai3/index.html">Bài 3</option>
          <option value="bai4/index.html">Bài 4</option>
          <option value="bai5/index.html">Bài 5</option>
          <option value="bai6/index.html">Bài 6</option>
          <option value="bai7/index.html">Bài 7</option>
          <option value="bai8/index.html">Bài 8</option>
          <option value="bai9/index.html">Bài 9</option>
          <option value="bai10/index.html">Bài 10</option>
          <option value="bai11/index.html">Bài 11</option>
          <option value="bai12/index.html">Bài 12</option>
          <option value="bai13/index.html">Bài 13</option>
          <option value="bai14/index.html">Bài 14</option>
          <option value="bai15/index.html">Bài 15</option>
          <option value="bai16/index.html">Bài 16</option>
          <option value="bai17/index.html">Bài 17</option>
          <option value="bai18/index.html">Bài 18</option>
          <option value="bai19/index.html">Bài 19+20</option>
          <option value="bai21/index.html">Bài 21</option>
          <option value="bai22/index.html">Bài 22</option>
          <option value="bai23/index.html">Bài 23</option>
          <option value="bai24/index.html">Bài 24+25</option>
        </optgroup>
      </select>
    </section>
    <footer>Học tiếng Nhật cùng Linh</footer>
  </main>
  <script>window.addEventListener('pageshow',()=>{document.getElementById('lessonSelect').value=''})</script>
</body>
</html>
