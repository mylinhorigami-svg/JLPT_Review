<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#d92779">
  <title>Luyện tập JLPT N5</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#251821;background:radial-gradient(circle at 50% 0,#ffe5f1,transparent 42%),#fffafc}.wrap{width:min(92%,680px);margin:auto;padding:42px 0}header{text-align:center;margin-bottom:34px}.mark{width:74px;height:74px;margin:auto;display:grid;place-items:center;border-radius:22px;background:#d92779;color:#fff;font-size:2rem;font-weight:900;box-shadow:0 12px 25px #d9277940}h1{font-size:clamp(1.8rem,7vw,2.6rem);margin:18px 0 8px}.sub{color:#786b74;line-height:1.6}.box{padding:24px;background:#fff;border:1px solid #ead7e1;border-radius:20px;box-shadow:0 12px 35px rgba(104,22,65,.09)}label{display:block;font-weight:800;margin-bottom:10px}select{width:100%;padding:16px;border:1px solid #ead7e1;border-radius:12px;background:#fff;font-size:16px;color:#251821}footer{text-align:center;color:#9b8d95;font-size:.8rem;margin-top:30px}
  </style>
</head>
<body>
  <main class="wrap">
    <header><div class="mark">あ</div><h1>Ôn tập JLPT N5</h1><div class="sub">Chọn nội dung đã học để bắt đầu ôn tập</div></header>
    <section class="box">
      <label for="lessonSelect">Chọn nội dung muốn luyện</label>
      <select id="lessonSelect" onchange="const target=this.value;this.value='';if(target) window.location.href=target">
        <option value="">-- Chọn nội dung luyện tập --</option>
        <optgroup label="Bảng chữ cái">
          <option value="mini_test_kana/hiragana/index.html">Ôn tập Hiragana</option>
          <option value="mini_test_kana/katakana/index.html">Ôn tập Katakana</option>
        </optgroup>
        <optgroup label="Từ vựng">
          <option value="bai1/index.html">Bài 1 - Từ vựng</option>
          <option value="bai2/index.html">Bài 2 - Từ vựng</option>
        </optgroup>
      </select>
    </section>
    <footer>Học tiếng Nhật cùng Linh</footer>
  </main>
  <script>window.addEventListener('pageshow',()=>{document.getElementById('lessonSelect').value=''})</script>
</body>
</html>
