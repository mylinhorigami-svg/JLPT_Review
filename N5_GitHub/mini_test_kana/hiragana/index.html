<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#d92779">
  <title>Hiragana</title>
  <style>
    :root{--pink:#d92779;--pink-dark:#aa185b;--pink-soft:#fff0f7;--ink:#251821;--muted:#786b74;--line:#ead7e1;--green:#16875c;--red:#ca3f4d;--shadow:0 18px 55px rgba(104,22,65,.13)}*{box-sizing:border-box}
    body{margin:0;min-height:100svh;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;color:var(--ink);background:radial-gradient(circle at 50% 0,#ffe5f1 0,transparent 40%),#fffafc}button{font:inherit}
    .shell{width:min(100%,680px);min-height:100svh;margin:auto;padding:20px 16px 32px;display:flex;flex-direction:column}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .brand{font-weight:800;color:var(--pink-dark)}
    select.lesson{font:inherit;font-size:.875rem;font-weight:800;color:var(--pink);background:#fff;border:1px solid #f1bad4;border-radius:999px;padding:7px 10px;max-width:190px}
    main{flex:1;display:flex;align-items:center;justify-content:center}
    .panel{width:100%;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:28px 22px}
    .eyebrow{text-align:center;color:var(--pink);font-size:.8rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
    .start-icon{width:78px;height:78px;margin:0 auto 22px;border-radius:24px;display:grid;place-items:center;background:var(--pink-soft);color:var(--pink);font-size:2.4rem;font-weight:900}
    .intro{color:var(--muted);line-height:1.65;text-align:center;margin:0 auto 26px}
    .primary,.secondary{width:100%;min-height:54px;border-radius:16px;border:0;font-weight:850;cursor:pointer}
    .primary{background:linear-gradient(135deg,var(--pink),#ee4c94);color:#fff}.secondary{background:#fff;color:var(--pink-dark);border:1.5px solid #e7a8c5;margin-top:12px}
    .quiz,.result{display:none}
    .quiz.active,.result.active{display:block}
    .start.hidden{display:none}
    .topline{display:flex;align-items:center;gap:14px;margin-bottom:28px}
    .count{font-size:.9rem;font-weight:800;color:var(--muted);white-space:nowrap}
    .bar{height:9px;flex:1;background:#f4e6ed;border-radius:99px;overflow:hidden}
    .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--pink),#ff76ad)}
    .prompt-wrap{text-align:center;margin-bottom:24px}
    .prompt-label{font-size:.88rem;color:var(--muted);margin-bottom:7px}
    .word{font-size:clamp(3rem,17vw,4rem);font-weight:750;line-height:1.25;margin:0 0 12px}
    .sound{width:50px;height:50px;border-radius:50%;border:1.5px solid #efb1cf;background:#fff5fa;color:var(--pink-dark);cursor:pointer;font-size:1.25rem}
    .answers{display:grid;gap:11px}
    .answer{min-height:57px;padding:12px 16px;border-radius:15px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-weight:750;cursor:pointer;font-size:2.2rem;}
    .answer.correct{border-color:var(--green);background:#eaf8f2;color:#0d704a}
    .answer.wrong{border-color:var(--red);background:#fff0f1;color:#a72f3b}
    .feedback{min-height:27px;margin:15px 0 0;text-align:center;font-weight:850}
    .feedback.good{color:var(--green)}.feedback.bad{color:var(--red)}
    .score-ring{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;margin:22px auto;background:conic-gradient(var(--pink) var(--score),#f2dce7 0);position:relative}
    .score-ring:after{content:"";position:absolute;inset:12px;border-radius:50%;background:#fff}
    .score-text{position:relative;z-index:1;text-align:center;font-weight:900;font-size:1.65rem}
    .result-note{text-align:center;color:var(--muted);line-height:1.6}h2{text-align:center}
    footer{text-align:center;color:#9b8d95;font-size:.78rem;margin-top:18px}@media(min-width:560px){
    .panel{padding:38px}
    .answers{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">Học tiếng Nhật cùng Linh</div>
    <select class="lesson" onchange="if(this.value) window.location.href=this.value">
      <option value="" selected>Hiragana</option>
      <option value="../katakana/index.html">Katakana</option>
      <option value="../../bai1/index.html">Từ vựng - Bài 1</option>
      <option value="../../bai2/index.html">Từ vựng - Bài 2</option>
      <option value="../../bai3/index.html">Từ vựng - Bài 3</option>
      <option value="../../bai4/index.html">Từ vựng - Bài 4</option>
      <option value="../../bai5/index.html">Từ vựng - Bài 5</option>
      <option value="../../bai6/index.html">Từ vựng - Bài 6</option>
      <option value="../../bai7/index.html">Từ vựng - Bài 7</option>
      <option value="../../bai8/index.html">Từ vựng - Bài 8</option>
      <option value="../../bai9/index.html">Từ vựng - Bài 9</option>
      <option value="../../bai10/index.html">Từ vựng - Bài 10</option>
      <option value="../../bai11/index.html">Từ vựng - Bài 11</option>
      <option value="../../bai12/index.html">Từ vựng - Bài 12</option>
      <option value="../../bai13/index.html">Từ vựng - Bài 13</option>
      <option value="../../bai14/index.html">Từ vựng - Bài 14</option>
      <option value="../../bai15/index.html">Từ vựng - Bài 15</option>
      <option value="../../bai16/index.html">Từ vựng - Bài 16</option>
      <option value="../../bai17/index.html">Từ vựng - Bài 17</option>
      <option value="../../bai18/index.html">Từ vựng - Bài 18</option>
      <option value="../../bai19/index.html">Từ vựng - Bài 19+20</option>
      <option value="../../bai21/index.html">Từ vựng - Bài 21</option>
      <option value="../../bai22/index.html">Từ vựng - Bài 22</option>
      <option value="../../bai23/index.html">Từ vựng - Bài 23</option>
      <option value="../../bai24/index.html">Từ vựng - Bài 24+25</option>

    </select>
  </header>
  <main>
    <section class="panel start" id="start">
      <div class="start-icon">あ</div>
      <p class="eyebrow">Ôn tập Hiragana</p>
      <p class="intro">Chọn hiragana đúng với âm đọc</p>
      <button class="primary" id="startBtn">Bắt đầu ôn tập</button>
    </section>
    <section class="panel quiz" id="quiz">
      <div class="topline">
        <div class="bar">
          <span id="progressBar"></span>
        </div><div class="count" id="count"></div></div>
        <div class="prompt-wrap"><div class="prompt-label" id="promptLabel"></div>
        <div class="word" id="word" lang="ja"></div>
        <button class="sound" id="soundBtn" title="Nghe lại">🔊</button>
      </div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div>
    </section>
    <section class="panel result" id="result">
      <p class="eyebrow">🌸 HOÀN THÀNH 🌸</p>
      <h2 id="resultTitle"></h2>
      <div class="score-ring" id="scoreRing">
        <div class="score-text"><span id="score"></span></div>
      </div><p class="result-note" id="resultNote"></p>
      <button class="primary" id="retryWrong">Luyện lại chữ đã sai</button>
      <button class="secondary" id="restart">Làm lại từ đầu</button>
    </section>

  </main>
  <footer>JLPT N5</footer>
</div>
<script>
const kana=[
['あ','a'],['い','i'],['う','u'],['え','e'],['お','o'],
['か','ka'],['き','ki'],['く','ku'],['け','ke'],['こ','ko'],
['さ','sa'],['し','shi'],['す','su'],['せ','se'],['そ','so'],
['た','ta'],['ち','chi'],['つ','tsu'],['て','te'],['と','to'],
['な','na'],['に','ni'],['ぬ','nu'],['ね','ne'],['の','no'],
['は','ha'],['ひ','hi'],['ふ','fu'],['へ','he'],['ほ','ho'],
['ま','ma'],['み','mi'],['む','mu'],['め','me'],['も','mo'],
['や','ya'],['ゆ','yu'],['よ','yo'],
['ら','ra'],['り','ri'],['る','ru'],['れ','re'],['ろ','ro'],
['わ','wa'],['を','wo'],['ん','n'],
['が','ga'],['ぎ','gi'],['ぐ','gu'],['げ','ge'],['ご','go'],
['ざ','za'],['じ','ji'],['ず','zu'],['ぜ','ze'],['ぞ','zo'],
['だ','da'],['ぢ','di'],['づ','du'],['で','de'],['ど','do'],
['ば','ba'],['び','bi'],['ぶ','bu'],['べ','be'],['ぼ','bo'],
['ぱ','pa'],['ぴ','pi'],['ぷ','pu'],['ぺ','pe'],['ぽ','po'],
['きゃ','kya'],['きゅ','kyu'],['きょ','kyo'],
['ぎゃ','gya'],['ぎゅ','gyu'],['ぎょ','gyo'],
['しゃ','sha'],['しゅ','shu'],['しょ','sho'],
['じゃ','ja'],['じゅ','ju'],['じょ','jo'],
['ちゃ','cha'],['ちゅ','chu'],['ちょ','cho'],
['にゃ','nya'],['にゅ','nyu'],['にょ','nyo'],
['ひゃ','hya'],['ひゅ','hyu'],['ひょ','hyo'],
['びゃ','bya'],['びゅ','byu'],['びょ','byo'],
['ぴゃ','pya'],['ぴゅ','pyu'],['ぴょ','pyo'],
['みゃ','mya'],['みゅ','myu'],['みょ','myo'],
['りゃ','rya'],['りゅ','ryu'],['りょ','ryo']
]

.map(([char,romaji])=>({char,romaji}));
const el=id=>document.getElementById(id);
let queue=[],index=0,score=0,wrong=[],answeredWrong=false,locked=false,player=new Audio();
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const current=()=>queue[index];
function speak(){player.pause();
  player.currentTime=0;
  player.src=`../audio-kana/${current().romaji}.mp3`;
  player.play().catch(()=>{})}

function choices(item){
  const pool=kana.filter(x=>x.char!==item.char);

  return shuffle([
    item,
    ...shuffle(pool).slice(0,3)
  ]);
}

function render(){
  locked=false;
  answeredWrong=false;

  const q=current();

  // Câu hỏi là Romaji
  el("promptLabel").textContent="Chọn chữ Hiragana đúng";
  el("word").textContent=q.romaji;

  el("count").textContent=`${index+1} / ${queue.length}`;
  el("progressBar").style.width=`${(index/queue.length)*100}%`;

  el("feedback").textContent="";
  el("feedback").className="feedback";

  // Đáp án là Kana
  el("answers").replaceChildren(
    ...choices(q).map(c=>{
      const b=document.createElement("button");

      b.className="answer";
      b.textContent=c.char;
      b.onclick=()=>choose(b,c);

      return b;
    })
  );

  // Tự phát âm thanh khi câu hỏi xuất hiện
  setTimeout(speak,180);
}

function choose(button,choice){
  if(locked) return;

  const q=current();

  // Kiểm tra chữ Kana đã chọn
  if(choice.char===q.char){
    locked=true;
    button.classList.add("correct");

    if(!answeredWrong){
      score++;
    }

    el("feedback").textContent="✓ Chính xác!";
    el("feedback").className="feedback good";

    [...el("answers").children].forEach(b=>{
      b.disabled=true;
    });

    setTimeout(()=>{
      index++;

      if(index<queue.length){
        render();
      }else{
        finish();
      }
    },650);

  }else{
    button.classList.add("wrong");
    button.disabled=true;
    answeredWrong=true;

    if(!wrong.includes(q)){
      wrong.push(q);
    }

    el("feedback").textContent="Chưa đúng, thử lại nhé!";
    el("feedback").className="feedback bad";
  }
}

function begin(items){queue=shuffle(items);
  index=0;score=0;
  wrong=[];el('start').classList.add('hidden');
  el('result').classList.remove('active');
  el('quiz').classList.add('active');render()
}

function finish(){el('quiz').classList.remove('active');
el('result').classList.add('active');
const pct=Math.round(score/queue.length*100);
el('score').textContent=`${score}/${queue.length}`;
el('scoreRing').style.setProperty('--score',`${pct*3.6}deg`);
el('resultTitle').textContent=pct===100?'Xuất sắc!':'Bạn đã làm xong!';
el('resultNote').textContent=wrong.length?`Bạn còn ${wrong.length} chữ cần ôn lại.`:'Bạn rất tuyệt vời!';
el('retryWrong').hidden=!wrong.length}
el('startBtn').onclick=()=>begin(kana);
el('soundBtn').onclick=speak;el('restart').onclick=()=>begin(kana);
el('retryWrong').onclick=()=>begin([...wrong]);
</script>
</body></html>
